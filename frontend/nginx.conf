server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API reverse proxy -> same origin for the browser, no CORS needed
  # PDF uploads (matches the backend's MAX_UPLOAD_MB=10 plus multipart overhead)
  client_max_body_size 12m;

  location /api/ {
    proxy_http_version 1.1;
    proxy_buffering off;          # stream answers (SSE) token by token
    proxy_read_timeout 300s;
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
